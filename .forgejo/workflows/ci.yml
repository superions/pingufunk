name: Pingufunk CI

on:
  push:
    branches: ["**"]

# Complete runs do not overwrite one another on the shared builder.
concurrency:
  group: pingufunk-ci
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: [self-hosted, linux, x64, ci-build]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Node.js
        run: node -e 'if (Number(process.versions.node.split(".")[0]) < 24) process.exit(1)'

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        timeout-minutes: 2
        run: npm run audit:dependencies

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  postgresql-integration:
    runs-on: [self-hosted, linux, x64, ci-build]
    strategy:
      fail-fast: false
      matrix:
        postgres: ["postgres:18-alpine"]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Node.js
        run: node -e 'if (Number(process.versions.node.split(".")[0]) < 24) process.exit(1)'

      - name: Install dependencies
        run: npm ci

      - name: Test PostgreSQL migration and runtime against disposable PostgreSQL
        env:
          PINGUFUNK_CI_POSTGRES_IMAGE: ${{ matrix.postgres }}
        run: npm run test:pg

  container:
    runs-on: [self-hosted, linux, x64, ci-build]
    timeout-minutes: 150
    env:
      PINGUFUNK_SMOKE_RUNNER_IMAGE: pingufunk-ci-runtime:${{ github.run_id }}
      PINGUFUNK_SMOKE_MIGRATOR_IMAGE: pingufunk-ci-migrator:${{ github.run_id }}
      PINGUFUNK_ARR_QA_RUNNER_IMAGE: pingufunk-ci-runtime:${{ github.run_id }}
      PINGUFUNK_ARR_QA_MIGRATOR_IMAGE: pingufunk-ci-migrator:${{ github.run_id }}
      PINGUFUNK_ARR_QA_RECEIVER_IMAGE: pingufunk-ci-receiver:${{ github.run_id }}
      PINGUFUNK_ARR_QA_YOUTUBE_ROLLBACK_IMAGE: pingufunk-ci-youtube-rollback:${{ github.run_id }}
      PINGUFUNK_SQLITE_ROLLBACK_IMAGE: pingufunk-ci-sqlite-rollback:${{ github.run_id }}
      PINGUFUNK_PG_ROLLBACK_IMAGE: pingufunk-ci-pg-rollback:${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # The host builder keeps its cache across jobs; image tags are run-owned.
      - name: Verify runner tools
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) < 24) process.exit(1)'
          docker buildx inspect default

      - name: Install locked harness dependencies
        run: npm ci

      - name: Build application image without publishing
        run: |
          docker buildx build --builder default --load --platform linux/amd64 --target runner \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/superions/pingufunk" \
            -t "$PINGUFUNK_SMOKE_RUNNER_IMAGE" .

      - name: Build migration image without publishing
        run: |
          docker buildx build --builder default --load --platform linux/amd64 --target migrator \
            -t "$PINGUFUNK_SMOKE_MIGRATOR_IMAGE" .

      - name: Verify real media completion on both disposable backends
        run: |
          docker pull postgres:18-alpine
          bash scripts/media-container-smoke.sh

      # LinuxServer documents GHCR as the direct registry behind LSCR.
      # Keep the same versioned images without the additional redirector.
      - name: Prepare pinned source-contract rollback and Arr fixtures
        env:
          SONARR_IMAGE: ghcr.io/linuxserver/sonarr:version-4.0.20.3014
          RADARR_IMAGE: ghcr.io/linuxserver/radarr:version-6.4.4.10685
          PROWLARR_IMAGE: ghcr.io/linuxserver/prowlarr:version-2.6.5.5623
        run: |
          docker pull "$SONARR_IMAGE"
          docker pull "$RADARR_IMAGE"
          docker pull "$PROWLARR_IMAGE"
          git archive c2ae58d8f1741b2657638ff4500f5eea19023e23 | docker buildx build --builder default --load --platform linux/amd64 --target runner -t "$PINGUFUNK_ARR_QA_YOUTUBE_ROLLBACK_IMAGE" -

      - name: Verify republished episodes through native Sonarr
        env:
          PINGUFUNK_ARR_QA_SONARR_IMAGE: ghcr.io/linuxserver/sonarr:version-4.0.20.3014
          PINGUFUNK_ARR_QA_RADARR_IMAGE: ghcr.io/linuxserver/radarr:version-6.4.4.10685
          PINGUFUNK_ARR_QA_PROWLARR_IMAGE: ghcr.io/linuxserver/prowlarr:version-2.6.5.5623
        run: |
          node scripts/tv-delivery-arr-smoke.mjs direct republished
          node scripts/tv-delivery-arr-smoke.mjs forwarded republished

      - name: Build the compatible Mediathek programme receiver without publishing
        run: |
          git archive 3e13fd7363641e342f7cdc4498ab47d347baeee0 | docker buildx build --builder default --load --platform linux/amd64 --target runner --label org.opencontainers.image.revision=3e13fd7363641e342f7cdc4498ab47d347baeee0 -t "$PINGUFUNK_ARR_QA_RECEIVER_IMAGE" -

      - name: Verify bound Mediathek programmes through native Arr on both backends
        env:
          PINGUFUNK_ARR_QA_SONARR_IMAGE: ghcr.io/linuxserver/sonarr:version-4.0.20.3014
          PINGUFUNK_ARR_QA_RADARR_IMAGE: ghcr.io/linuxserver/radarr:version-6.4.4.10685
          PINGUFUNK_ARR_QA_PROWLARR_IMAGE: ghcr.io/linuxserver/prowlarr:version-2.6.5.5623
        run: |
          for provider in sqlite postgresql; do
            node scripts/programme-arr-smoke.mjs direct "$provider" pair
            node scripts/programme-arr-smoke.mjs forwarded "$provider" pair
            node scripts/programme-arr-smoke.mjs direct "$provider"
            node scripts/programme-arr-smoke.mjs forwarded "$provider"
          done
          node scripts/programme-arr-smoke.mjs direct sqlite pair-tba

      - name: Verify YouTube cold delivery and rollback through native Arr on both backends
        env:
          PINGUFUNK_ARR_QA_SONARR_IMAGE: ghcr.io/linuxserver/sonarr:version-4.0.20.3014
          PINGUFUNK_ARR_QA_RADARR_IMAGE: ghcr.io/linuxserver/radarr:version-6.4.4.10685
          PINGUFUNK_ARR_QA_PROWLARR_IMAGE: ghcr.io/linuxserver/prowlarr:version-2.6.5.5623
        run: |
          for provider in sqlite postgresql; do
            node scripts/youtube-arr-smoke.mjs direct "$provider"
            node scripts/youtube-arr-smoke.mjs forwarded "$provider"
          done

      - name: Verify native rendition quality directly and through Prowlarr
        env:
          PINGUFUNK_ARR_QA_SONARR_IMAGE: ghcr.io/linuxserver/sonarr:version-4.0.20.3014
          PINGUFUNK_ARR_QA_RADARR_IMAGE: ghcr.io/linuxserver/radarr:version-6.4.4.10685
          PINGUFUNK_ARR_QA_PROWLARR_IMAGE: ghcr.io/linuxserver/prowlarr:version-2.6.5.5623
        run: |
          bash scripts/rendition-quality-arr-smoke.sh

      - name: Verify cold search to deferred RSS and real Sonarr imports
        env:
          PINGUFUNK_ARR_QA_SONARR_IMAGE: ghcr.io/linuxserver/sonarr:version-4.0.20.3014
          PINGUFUNK_ARR_QA_RADARR_IMAGE: ghcr.io/linuxserver/radarr:version-6.4.4.10685
          PINGUFUNK_ARR_QA_PROWLARR_IMAGE: ghcr.io/linuxserver/prowlarr:version-2.6.5.5623
        run: |
          node scripts/tv-delivery-arr-smoke.mjs direct
          node scripts/tv-delivery-arr-smoke.mjs forwarded

      - name: Build pinned rollback checkpoints without publishing
        run: |
          git archive e2e53b00746a57a96d2b361497f8dbdcaa490e95 | docker buildx build --builder default --load --platform linux/amd64 --target runner -t "$PINGUFUNK_SQLITE_ROLLBACK_IMAGE" -
          git archive bfa93e219fd3ac2bacf05de4543dc569505fce1b | docker buildx build --builder default --load --platform linux/amd64 --target runner -t "$PINGUFUNK_PG_ROLLBACK_IMAGE" -

      - name: Verify runtime tooling without global package manager
        run: |
          for image in "$PINGUFUNK_SMOKE_RUNNER_IMAGE" "$PINGUFUNK_SMOKE_MIGRATOR_IMAGE"; do
            docker run --rm --entrypoint sh "$image" -ec '
              test ! -e /usr/local/lib/node_modules/npm
              ! command -v npm
              ! command -v npx
              node --version
            '
          done
          docker run --rm --entrypoint node "$PINGUFUNK_SMOKE_MIGRATOR_IMAGE" /app/node_modules/prisma/build/index.js --version

      - name: Rehearse disposable TLS migration and post-write rollback
        run: |
          export PINGUFUNK_SMOKE_ROLLBACK_IMAGE="$(docker image inspect "$PINGUFUNK_PG_ROLLBACK_IMAGE" --format '{{.Id}}')"
          PINGUFUNK_SMOKE_SQLITE_ROLLBACK_IMAGE="$(docker image inspect "$PINGUFUNK_SQLITE_ROLLBACK_IMAGE" --format '{{.Id}}')" bash scripts/postgresql-container-smoke.sh
          PINGUFUNK_SMOKE_SOURCE_VARIANT=current bash scripts/postgresql-container-smoke.sh

      - name: Verify isolated SQLite runtime and persistence
        run: |
          PINGUFUNK_SMOKE_ROLLBACK_IMAGE="$(docker image inspect "$PINGUFUNK_SQLITE_ROLLBACK_IMAGE" --format '{{.Id}}')" bash scripts/sqlite-container-smoke.sh

      - name: Verify explicit TV source review and real worker on both backends
        run: |
          bash scripts/tv-review-container-smoke.sh sqlite
          bash scripts/tv-review-container-smoke.sh postgresql

      - name: Export the exact tested runtime without publishing
        if: github.event_name == 'push'
        run: |
          mkdir -p release-artifact
          release_image="pingufunk-ci-export:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker tag "$PINGUFUNK_SMOKE_RUNNER_IMAGE" "$release_image"
          docker save -o release-artifact/runner-amd64.tar "$release_image"
          docker image inspect "$release_image" --format '{{json .}}' | node -e '
            let input="";process.stdin.on("data",x=>input+=x);process.stdin.on("end",()=>{
              const x=JSON.parse(input);require("node:fs").writeFileSync("release-artifact/image-identity.json",JSON.stringify({id:x.Id,os:x.Os,architecture:x.Architecture,revision:x.Config.Labels["org.opencontainers.image.revision"]}));
            });'
          sha256sum release-artifact/runner-amd64.tar > release-artifact/archive.sha256

      - name: Retain the tested runtime for explicit distribution
        if: github.event_name == 'push'
        uses: https://data.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: pingufunk-runner-amd64-${{ github.sha }}
          path: release-artifact/
          retention-days: 3
          compression-level: 1

      - name: Export the natively qualified compatible receiver without publishing
        if: github.event_name == 'push'
        run: |
          mkdir -p receiver-artifact
          receiver_image="pingufunk-ci-receiver-export:${GITHUB_RUN_ID}"
          docker tag "$PINGUFUNK_ARR_QA_RECEIVER_IMAGE" "$receiver_image"
          docker save -o receiver-artifact/runner-amd64.tar "$receiver_image"
          docker image inspect "$receiver_image" --format '{{json .}}' | node -e '
            let input="";process.stdin.on("data",x=>input+=x);process.stdin.on("end",()=>{
              const x=JSON.parse(input);require("node:fs").writeFileSync("receiver-artifact/image-identity.json",JSON.stringify({id:x.Id,os:x.Os,architecture:x.Architecture,revision:x.Config.Labels["org.opencontainers.image.revision"]}));
            });'
          sha256sum receiver-artifact/runner-amd64.tar > receiver-artifact/archive.sha256

      - name: Retain the compatible receiver for explicit distribution
        if: github.event_name == 'push'
        uses: https://data.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: pingufunk-receiver-amd64-3e13fd7363641e342f7cdc4498ab47d347baeee0
          path: receiver-artifact/
          retention-days: 3
          compression-level: 1

      - name: Remove only this run image tags
        if: always()
        run: |
          set -e
          for image in "$PINGUFUNK_SMOKE_RUNNER_IMAGE" "$PINGUFUNK_SMOKE_MIGRATOR_IMAGE" \
            "$PINGUFUNK_ARR_QA_RECEIVER_IMAGE" "$PINGUFUNK_ARR_QA_YOUTUBE_ROLLBACK_IMAGE" \
            "$PINGUFUNK_SQLITE_ROLLBACK_IMAGE" "$PINGUFUNK_PG_ROLLBACK_IMAGE" \
            "pingufunk-ci-export:${GITHUB_SHA}-${GITHUB_RUN_ID}" \
            "pingufunk-ci-receiver-export:${GITHUB_RUN_ID}"; do
            if docker image inspect "$image" >/dev/null 2>&1; then docker image rm "$image"; fi
          done
