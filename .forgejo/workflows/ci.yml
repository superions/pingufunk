name: Pingufunk CI

on:
  push:
    branches: ["**"]

# Runs for the same branch finish in order; each uses its own image tags.
concurrency:
  group: pingufunk-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: [self-hosted, linux, x64, ci-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Node.js
        run: node -e 'if (Number(process.versions.node.split(".")[0]) < 24) process.exit(1)'

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        timeout-minutes: 2
        run: npm run audit:dependencies

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage -- --maxWorkers=4

  postgresql-integration:
    runs-on: [self-hosted, linux, x64, ci-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Node.js
        run: node -e 'if (Number(process.versions.node.split(".")[0]) < 24) process.exit(1)'

      - name: Install dependencies
        run: npm ci

      - name: Test PostgreSQL migration and runtime against disposable PostgreSQL
        env:
          PINGUFUNK_CI_POSTGRES_IMAGE: postgres:18-alpine
        run: npm run test:pg

  container:
    runs-on: [self-hosted, linux, x64, ci-build]
    timeout-minutes: 45
    env:
      PINGUFUNK_SMOKE_RUNNER_IMAGE: pingufunk-ci-runtime:${{ github.run_id }}
      PINGUFUNK_SMOKE_MIGRATOR_IMAGE: pingufunk-ci-migrator:${{ github.run_id }}
      PINGUFUNK_ARR_QA_RUNNER_IMAGE: pingufunk-ci-runtime:${{ github.run_id }}
      PINGUFUNK_ARR_QA_MIGRATOR_IMAGE: pingufunk-ci-migrator:${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # The host builder keeps its cache across jobs; image tags are run-owned.
      - name: Verify runner tools
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) < 24) process.exit(1)'
          docker buildx inspect default

      - name: Install locked harness dependencies
        run: npm ci

      - name: Build application image without publishing
        run: |
          docker buildx build --builder default --load --platform linux/amd64 --target runner \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/superions/pingufunk" \
            -t "$PINGUFUNK_SMOKE_RUNNER_IMAGE" .

      - name: Build migration image without publishing
        run: |
          docker buildx build --builder default --load --platform linux/amd64 --target migrator \
            -t "$PINGUFUNK_SMOKE_MIGRATOR_IMAGE" .

      - name: Verify packaged runtime tooling
        run: |
          for image in "$PINGUFUNK_SMOKE_RUNNER_IMAGE" "$PINGUFUNK_SMOKE_MIGRATOR_IMAGE"; do
            docker run --rm --entrypoint sh "$image" -ec '
              test ! -e /usr/local/lib/node_modules/npm
              ! command -v npm
              ! command -v npx
              node --version
            '
          done
          docker run --rm --entrypoint node "$PINGUFUNK_SMOKE_MIGRATOR_IMAGE" /app/node_modules/prisma/build/index.js --version

      # LinuxServer documents GHCR as the direct registry behind LSCR.
      # Keep the same versioned images without the additional redirector.
      - name: Prepare pinned Arr test images
        timeout-minutes: 10
        env:
          SONARR_IMAGE: ghcr.io/linuxserver/sonarr:version-4.0.20.3014
          RADARR_IMAGE: ghcr.io/linuxserver/radarr:version-6.4.4.10685
          PROWLARR_IMAGE: ghcr.io/linuxserver/prowlarr:version-2.6.5.5623
        run: |
          set -euo pipefail
          pull_log="$(mktemp)"
          trap 'rm -f "$pull_log"' EXIT
          for fixture in "$SONARR_IMAGE" "$RADARR_IMAGE" "$PROWLARR_IMAGE"; do
            for attempt in 1 2 3; do
              if docker pull "$fixture" >"$pull_log" 2>&1; then cat "$pull_log"; break; fi
              cat "$pull_log" >&2
              if ! grep -qiE 'toomanyrequests|too many requests|429' "$pull_log" || [ "$attempt" = 3 ]; then exit 1; fi
              sleep "$((attempt * 5))"
            done
          done

      - name: Verify media and republished episodes on isolated consumers
        env:
          PINGUFUNK_ARR_QA_SONARR_IMAGE: ghcr.io/linuxserver/sonarr:version-4.0.20.3014
          PINGUFUNK_ARR_QA_RADARR_IMAGE: ghcr.io/linuxserver/radarr:version-6.4.4.10685
          PINGUFUNK_ARR_QA_PROWLARR_IMAGE: ghcr.io/linuxserver/prowlarr:version-2.6.5.5623
        run: |
          set -euo pipefail
          docker pull postgres:18-alpine
          bash scripts/media-container-smoke.sh & media_pid=$!
          trap 'kill -TERM "$media_pid" 2>/dev/null || true; wait || true; exit 143' TERM INT
          status=0
          node scripts/tv-delivery-arr-smoke.mjs direct republished || status=1
          node scripts/tv-delivery-arr-smoke.mjs forwarded republished || status=1
          wait "$media_pid" || status=1
          trap - TERM INT
          exit "$status"

      - name: Export the exact tested runtime without publishing
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p release-artifact
          release_image="pingufunk-ci-export:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker tag "$PINGUFUNK_SMOKE_RUNNER_IMAGE" "$release_image"
          docker save -o release-artifact/runner-amd64.tar "$release_image"
          docker image inspect "$release_image" --format '{{json .}}' | node -e '
            let input="";process.stdin.on("data",x=>input+=x);process.stdin.on("end",()=>{
              const x=JSON.parse(input);require("node:fs").writeFileSync("release-artifact/image-identity.json",JSON.stringify({id:x.Id,os:x.Os,architecture:x.Architecture,revision:x.Config.Labels["org.opencontainers.image.revision"]}));
            });'
          sha256sum release-artifact/runner-amd64.tar > release-artifact/archive.sha256

      - name: Retain the tested runtime for explicit distribution
        if: github.ref == 'refs/heads/main'
        uses: https://data.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: pingufunk-runner-amd64-${{ github.sha }}
          path: release-artifact/
          retention-days: 3
          compression-level: 1

      - name: Remove only this run image tags
        if: always()
        run: |
          set -e
          for image in "$PINGUFUNK_SMOKE_RUNNER_IMAGE" "$PINGUFUNK_SMOKE_MIGRATOR_IMAGE" \
            "pingufunk-ci-export:${GITHUB_SHA}-${GITHUB_RUN_ID}"; do
            if docker image inspect "$image" >/dev/null 2>&1; then docker image rm "$image"; fi
          done

  export-public-source:
    if: github.ref == 'refs/heads/main'
    needs: [checks, postgresql-integration, container]
    runs-on: [self-hosted, linux, x64, ci-build]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export the tested main commit without rewriting public history
        env:
          PUBLIC_GIT_DEPLOY_KEY: ${{ secrets.PUBLIC_GIT_DEPLOY_KEY }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-export-github.sh

  publish-ghcr:
    if: github.ref == 'refs/heads/main'
    needs: [export-public-source, container]
    runs-on: [self-hosted, linux, x64, ci-build]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: https://data.forgejo.org/forgejo/download-artifact@8d4e9521a5f7e5f8b6351f341f719f9f45a92a3a # v6
        with:
          name: pingufunk-runner-amd64-${{ github.sha }}
          path: release-artifact/
      - name: Publish the exact tested image to GHCR
        env:
          PUBLIC_GHCR_TOKEN: ${{ secrets.PUBLIC_GHCR_TOKEN }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-publish-ghcr.sh
